<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b3a78" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PNEUAÇO Estoque" />

  <title>PNEUAÇO Estoque</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f8fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 5;
      background: #ffffff;
      color: #0b3a78;
      text-align: center;
      padding: 24px;
    }
    #loading img {
      width: min(440px, 82vw);
      height: auto;
      display: block;
      margin: 0 auto 18px;
    }
    #loading strong {
      display: block;
      font-size: 20px;
      margin-bottom: 6px;
    }
    #loading span {
      color: #667085;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <img src="icon-512.png" alt="PNEUAÇO" />
      <strong>Consulta de Estoque</strong>
      <span>Carregando estoque online...</span>
    </div>
  </div>

  <iframe
    id="app"
    title="PNEUAÇO Estoque"
    src="https://pneuacoestoque-vendedores.streamlit.app/"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const frame = document.getElementById("app");
    const loading = document.getElementById("loading");
    frame.addEventListener("load", () => {
      setTimeout(() => loading.style.display = "none", 500);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
</body>
</html>
